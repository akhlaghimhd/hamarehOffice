services:
  db:
    image: mariadb:11.4
    container_name: hamarehoffice-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hamarehoffice
      MYSQL_USER: hamareh
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - hamarehoffice_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hamarehoffice_db_data:
