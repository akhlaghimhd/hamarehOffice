services:
  db:
    image: mariadb:11.4
    container_name: hamarehoffice-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hamarehoffice
      MYSQL_USER: hamareh
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - hamarehoffice_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./docker/app
    container_name: hamarehoffice-app
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./project:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      APACHE_RUN_USER: www-data
      APACHE_RUN_GROUP: www-data

volumes:
  hamarehoffice_db_data:
